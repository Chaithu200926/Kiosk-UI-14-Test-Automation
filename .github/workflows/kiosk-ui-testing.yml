# KIOSK UI Testing: runs or publishes the CinescapeKiosk UI tests and shows them on the dashboard.
#
# Two ways in:
#   * Usual: `npm run publish-results` runs the tests on the QA PC (the kiosk app and the UAT API are only
#     available there, and UI tests need an unlocked Windows desktop) and pushes the results into reports/.
#     That push starts this workflow, which publishes the dashboard to GitHub Pages, shows the results table
#     on the run page, and turns the run red if any test failed.
#   * Optional: "Run workflow" with "Run the tests on the QA PC's runner" ticked runs the tests from GitHub.
#     This needs a self-hosted runner with label "kiosk-ui" started with run.cmd in the logged-in, unlocked
#     desktop session of the QA PC (not as a service: the kiosk opens full screen). Registered on 4 Oct 2026
#     (folder C:/actions-runner) once Windows Code Integrity allowed the runner program.
# There is deliberately no pull_request trigger: the repo is public and the runner is inside the office.
name: KIOSK UI Testing

on:
  # Start when new test results are pushed to main.
  push:
    branches: [main]
    paths: ['reports/**']
  # Allow starting it by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      run_on_runner:
        description: Run the tests on the QA PC's runner (label kiosk-ui); otherwise just republish the last results
        type: boolean
        default: false
      include_paying_tests:
        description: Also run the paying tests (KUI-07/16, 08, 10 by KNET with the fake terminal, about KWD 8 of UAT bookings; KUI-11 wallet KWD 0.500; KUI-20 top-up KWD 10)
        type: boolean
        default: false
      tests:
        description: Only these tests (test IDs, e.g. "KUI-06 KUI-10 KUI-15"); empty = all. Paying tests named here run even when the box above is not ticked.
        type: string
        default: ''

# Permissions needed to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two runs at once (there is one kiosk); queue them instead.
concurrency:
  group: kiosk-ui-testing
  cancel-in-progress: false

jobs:
  # Job 1 (optional): run the tests on the QA PC through its self-hosted runner.
  run-tests:
    name: Run kiosk UI tests on the QA PC
    if: github.event_name == 'workflow_dispatch' && inputs.run_on_runner
    runs-on: [self-hosted, windows, kiosk-ui]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      # Get the code, including the committed run history in reports/.
      - name: Check out the code
        uses: actions/checkout@v4

      # Install the exact package versions from package-lock.json (Playwright, WebdriverIO, Appium, NovaWindows).
      - name: Install dependencies
        run: npm ci

      # The test account, club card and admin PIN are never in the repo: use the QA PC's own .env file
      # (repository variable KIOSK_UI_ENV_FILE, or the project folder on the QA PC).
      - name: Use the QA PC's test settings
        run: Copy-Item -LiteralPath "${{ vars.KIOSK_UI_ENV_FILE || 'C:\softwares\vs code\playwright\CinescapeKiosk-UI-Automation\.env' }}" -Destination .env

      # Run the tests. Failed tests do not stop the job: they are reported on the dashboard.
      # The chosen test IDs come in through an environment variable (not pasted into the script) and only
      # "KUI-nn" IDs are used, so a typed value cannot run anything else.
      - name: Run the tests (the kiosk opens full screen)
        continue-on-error: true
        env:
          TESTS: ${{ inputs.tests }}
          PAYING: ${{ inputs.include_paying_tests }}
        run: |
          $ids = @([regex]::Matches("$env:TESTS", 'KUI-\d{2}') | ForEach-Object { $_.Value.Substring(4) } | Select-Object -Unique)
          if ($ids.Count -gt 0) { npx playwright test --grep "KUI-($($ids -join '|')) " }
          elseif ($env:PAYING -eq 'true') { npx playwright test }
          else { npx playwright test --grep-invert "KUI-(07|08|10|11|16|20) " }

      # Build the dashboard in reports/ (as publish-results does); results.json keeps only the stats.
      - name: Build the dashboard
        run: |
          Copy-Item test-results\results.json reports\results.json -Force
          $env:REPORT_DIR = 'reports'; $env:KIOSK_TRIGGER = 'self-hosted runner on the QA PC'
          node scripts/generate-dashboard.js
          node -e "const fs=require('fs');const f='reports/results.json';fs.writeFileSync(f,JSON.stringify({stats:JSON.parse(fs.readFileSync(f,'utf8')).stats},null,2))"

      # Hand the dashboard to the publish job.
      - name: Upload the dashboard
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-ui-reports
          path: reports

      # Never leave the .env copy in the runner's work folder.
      - name: Remove the settings copy
        if: always()
        run: Remove-Item .env -ErrorAction SilentlyContinue

  # Job 2: publish the dashboard (the fresh one from job 1, or the committed reports/).
  publish:
    name: Publish dashboard and results
    needs: run-tests
    if: always() && needs.run-tests.result != 'failure' && needs.run-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Get the committed reports/ folder.
      - name: Check out the code
        uses: actions/checkout@v4

      # When job 1 ran, use its fresh dashboard instead.
      - name: Use the dashboard from the QA PC run
        if: needs.run-tests.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: kiosk-ui-reports
          path: reports

      # Put the results table on this run page.
      - name: Show test results on this run
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      # Package reports/ as the website content.
      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      # Publish the website.
      - name: Deploy dashboard to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Mark this run red when any test failed, so failures are visible in the Actions list.
      - name: Fail the run if any test failed
        run: |
          failed=$(jq '.stats.unexpected // 0' reports/results.json)
          echo "Failed tests: $failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed test(s) failed. See the dashboard or the summary above."
            exit 1
          fi
